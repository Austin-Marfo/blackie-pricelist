<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blackie Photography — Printable Price Booklet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#141210; --muted:#6f665c; --gold:#b8892f; --line:#e6ded2; --paper:#fffdf9; --soft:#f6f0e6;
         --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,sans-serif; }
  *{box-sizing:border-box}
  body{margin:0;background:#3a3631;color:var(--ink);font-family:var(--sans);-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .tools{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:12px 16px;background:#1d1b18;color:#f4efe7;font-size:14px}
  .tools button{font:inherit;font-weight:800;padding:10px 18px;border-radius:10px;border:0;background:#d4a84b;color:#141210;cursor:pointer}
  .tools label{display:flex;gap:6px;align-items:center}
  .pages{display:grid;gap:24px;justify-content:center;padding:24px 16px 60px}
  .page{width:148mm;height:210mm;max-width:100%;background:var(--paper);padding:13mm 12mm;position:relative;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  .pno{position:absolute;bottom:7mm;left:0;right:0;text-align:center;font-size:8pt;color:var(--muted);letter-spacing:2px}

  .eyebrow{font-size:8pt;letter-spacing:3px;font-weight:800;color:var(--gold);text-transform:uppercase}
  h1,h2{font-family:var(--serif);font-weight:600;margin:0;line-height:1}
  h1{font-size:40pt} h2{font-size:30pt;margin:2mm 0 1mm}
  .lead{color:var(--muted);font-size:10.5pt;margin:0 0 7mm}

  /* cover */
  .cover{background:#121110;color:#f4efe7;justify-content:center;text-align:center}
  .cover img{width:30mm;height:30mm;border-radius:50%;object-fit:cover;margin:0 auto 6mm}
  .cover h1{font-size:44pt;color:#f4efe7}
  .cover .eyebrow{color:#d4a84b;margin-bottom:3mm}
  .cover .tag{font-family:var(--serif);font-style:italic;font-size:15pt;color:#cfc6b9;margin:5mm 8mm 10mm}
  .qr{background:#fff;padding:3mm;border-radius:3mm;display:inline-block;margin:0 auto}
  .qr img,.qr canvas{display:block;width:34mm!important;height:34mm!important}
  .scan{font-weight:800;font-size:10pt;letter-spacing:2px;text-transform:uppercase;color:#d4a84b;margin-top:3mm}
  .cover .contact{margin-top:auto;font-size:9pt;color:#a59c90;line-height:1.7}

  /* at a glance */
  table{width:100%;border-collapse:collapse;font-size:10.5pt}
  th{font-size:8pt;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:800;text-align:center;padding:2mm 1mm 3mm}
  th.pop{color:var(--gold)}
  td{padding:4.2mm 1mm;border-top:1px solid var(--line);text-align:center;font-weight:800;font-size:14pt}
  td:first-child{text-align:left;font-family:var(--serif);font-size:16pt;font-weight:600}
  td:first-child small{display:block;font-family:var(--sans);font-size:7.5pt;color:var(--muted);font-weight:500;letter-spacing:0}
  td.pop{background:var(--soft);color:var(--gold)}
  .gl-feat{display:grid;grid-template-columns:repeat(3,1fr);gap:3mm;margin-top:6mm}
  .gl-feat div{background:var(--soft);border-radius:3mm;padding:3mm;font-size:8.5pt;line-height:1.5}
  .gl-feat b{display:block;font-size:8pt;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:1mm}
  .note{font-size:8.5pt;color:var(--muted);margin-top:5mm;line-height:1.5}

  /* category page */
  .tiers{display:grid;gap:4mm;flex:1}
  .tier{border:1px solid var(--line);border-radius:4mm;padding:4.5mm 5mm;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2mm 6mm;position:relative}
  .tier.pop{border:2px solid var(--gold);background:var(--soft)}
  .tier .nm{font-size:9pt;letter-spacing:3px;font-weight:800;text-transform:uppercase;color:var(--gold)}
  .tier .pr{grid-row:span 2;font-size:26pt;font-weight:800;letter-spacing:-.5px;text-align:right}
  .tier .pr small{font-size:11pt;color:var(--muted);font-weight:700}
  .tier ul{list-style:none;margin:0;padding:0;font-size:10pt;line-height:1.75}
  .tier ul b{font-size:11pt}
  .pill{position:absolute;top:-2.6mm;right:6mm;background:var(--gold);color:#fff;font-size:7pt;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:1mm 3mm;border-radius:99px}
  .catfoot{margin-top:5mm;font-size:8.5pt;color:var(--muted);border-top:1px solid var(--line);padding-top:3mm}

  /* extras */
  .ex{display:grid;gap:0}
  .ex div{display:flex;justify-content:space-between;padding:3.4mm 0;border-bottom:1px solid var(--line);font-size:11pt}
  .ex div span small{display:block;font-size:8pt;color:var(--muted)}
  .ex div b{font-size:12pt}
  .info{margin-top:6mm;background:var(--soft);border-radius:4mm;padding:4mm 5mm;font-size:9pt;line-height:1.6}
  .info ul{margin:1mm 0 0;padding-left:4mm}
  .contactbox{margin-top:auto;display:flex;gap:5mm;align-items:center;padding-top:5mm}
  .contactbox .qr{padding:1.5mm;border:1px solid var(--line)}
  .contactbox .qr img,.contactbox .qr canvas{width:24mm!important;height:24mm!important}
  .contactbox div.t{font-size:9pt;line-height:1.7}

  @page{size:A5;margin:0}
  @media print{
    body{background:none}
    .tools{display:none}
    .pages{display:block;padding:0}
    .page{box-shadow:none;page-break-after:always;break-after:page;width:148mm;height:210mm;max-width:none}
    .page.skip{display:none}
  }
</style>
</head>
<body>
<div class="tools">
  <button onclick="window.print()">Print / Save as PDF</button>
  <label><input type="checkbox" id="only-card"> Counter card only (page 2)</label>
  <span>Paper: A5 · Margins: none · Background graphics: on</span>
</div>
<div class="pages" id="pages"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>document.write('<script src="pricing.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
const D = window.BLACKIE, C = D.currency, S = D.studio;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pop = D.popularTier;
const tierNames = D.categories[0].tiers.map(t => t);
let n = 0;
const pg = (cls, html) => `<section class="page ${cls}">${html}<div class="pno">BLACKIE PHOTOGRAPHY · ${++n}</div></section>`;

const cover = pg("cover", `
  <img src="${esc(S.logo)}" alt="" onerror="this.style.display='none'">
  <div class="eyebrow">Blackie Photography</div>
  <h1>Portrait<br>Rates</h1>
  <p class="tag">${esc(S.tagline)}</p>
  <div class="qr" id="qr1"></div>
  <div class="scan">Scan to see prices & book</div>
  <div class="contact">${S.phones.map(esc).join("  ·  ")}<br>${esc(S.location)}<br>IG @${esc(S.instagram)} · TikTok ${esc(S.tiktok)}</div>`);

const glance = pg("card", `
  <div class="eyebrow">At a glance</div>
  <h2>All prices, one page</h2>
  <p class="lead">Pick your session type, then your package. Extras on the back page.</p>
  <table>
    <thead><tr><th></th>${tierNames.map(t => `<th class="${t.id===pop?"pop":""}">${esc(t.name)}${t.id===pop?"<br>★ Popular":""}</th>`).join("")}</tr></thead>
    <tbody>${D.categories.map(c => `<tr><td>${esc(c.name)}<small>${esc(c.blurb)}</small></td>
      ${c.tiers.map(t => `<td class="${t.id===pop?"pop":""}">${C}${t.price}</td>`).join("")}</tr>`).join("")}</tbody>
  </table>
  <div class="gl-feat">
    ${tierNames.map(t => `<div><b>${esc(t.name)}</b>${t.outfits} outfits<br>${t.photos} edited photos</div>`).join("")}
  </div>
  <p class="note">Session length depends on the type of shoot (30–90 mins). Group/Family: Essential up to 3 people, Classic up to 4, Premium up to 5 — extra person +${C}100.</p>`);

const catPages = D.categories.map(c => pg("", `
  <div class="eyebrow">${esc(c.blurb)}</div>
  <h2>${esc(c.name)}</h2>
  <p class="lead">Three packages — choose the one that fits.</p>
  <div class="tiers">
    ${c.tiers.map(t => `<div class="tier ${t.id===pop?"pop":""}">
      ${t.id===pop ? `<span class="pill">Most popular</span>` : ""}
      <div class="nm">${esc(t.name)}</div>
      <div class="pr"><small>${C}</small>${t.price}</div>
      <ul>
        ${t.people ? `<li>Up to <b>${t.people}</b> people</li>` : ""}
        <li><b>${t.outfits}</b> outfits</li>
        <li><b>${t.photos}</b> edited photos</li>
        <li>Up to <b>${t.minutes}</b> minutes</li>
      </ul>
    </div>`).join("")}
  </div>
  <div class="catfoot">Want more? Add an outdoor shoot, extra looks or extra photos — see Extras.</div>`));

const extras = pg("", `
  <div class="eyebrow">Make it yours</div>
  <h2>Extras</h2>
  <p class="lead">Add any of these to any package.</p>
  <div class="ex">
    ${D.addons.map(a => `<div><span>${esc(a.name)}<small>${esc(a.note || "")}${a.only ? " · Group/Family only" : ""}</small></span><b>+${C}${a.price}</b></div>`).join("")}
  </div>
  <div class="info"><b>Good to know</b><ul>${D.notes.map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
  <div class="contactbox">
    <div class="qr" id="qr2"></div>
    <div class="t"><b>Book on WhatsApp</b><br>${S.phones.map(esc).join(" · ")}<br>${esc(S.location)}<br>IG @${esc(S.instagram)}</div>
  </div>`);

document.getElementById("pages").innerHTML = cover + glance + catPages.join("") + extras;

function qr(id, size){
  const el = document.getElementById(id);
  if (window.QRCode) new QRCode(el, { text: S.menuUrl, width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
  else el.textContent = S.menuUrl;
}
qr("qr1", 400); qr("qr2", 300);

document.getElementById("only-card").addEventListener("change", e => {
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("skip", e.target.checked && !p.classList.contains("card")));
});
})();
</script>
</body>
</html>

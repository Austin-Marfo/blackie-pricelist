<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0c0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Blackie Photography — Book a Session</title>
<link rel="icon" href="https://austin-marfo.github.io/blackie-pricelist/favicon1.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0c0b; --surface:#171513; --surface-2:#211e1b; --line:#2f2a25;
    --text:#f4efe7; --muted:#a59c90; --gold:#d4a84b; --gold-2:#f0cf86; --ink:#141210;
    --ok:#5fbf8a; --danger:#e07a5f;
    --r:18px; --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.45;
       -webkit-font-smoothing:antialiased;overscroll-behavior:none;user-select:none}
  input,textarea,select{user-select:text}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  .app{min-height:100%;display:flex;flex-direction:column;max-width:1180px;margin:0 auto;padding:20px 24px 120px}

  /* header */
  .top{display:flex;align-items:center;gap:14px;padding:4px 0 18px;border-bottom:1px solid var(--line);margin-bottom:26px}
  .top img{width:46px;height:46px;border-radius:50%;object-fit:cover;background:var(--surface-2)}
  .brand{font-family:var(--serif);font-size:26px;font-weight:700;letter-spacing:.5px;line-height:1}
  .brand small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:3px;color:var(--gold);font-weight:700;margin-top:5px}
  .top .spacer{flex:1}
  .back{display:inline-flex;align-items:center;gap:8px;padding:12px 18px;border-radius:999px;background:var(--surface-2);font-weight:700;font-size:15px}
  .back svg{width:18px;height:18px}

  /* steps */
  .steps{display:flex;gap:8px;margin:-8px 0 22px}
  .steps span{flex:1;height:4px;border-radius:4px;background:var(--line)}
  .steps span.on{background:var(--gold)}

  h1{font-family:var(--serif);font-weight:600;font-size:clamp(34px,5vw,52px);line-height:1.05;margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 26px;font-size:18px}

  /* category grid */
  .cats{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
  .cat{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
       padding:26px 26px 24px;min-height:190px;display:flex;flex-direction:column;transition:transform .12s, border-color .12s}
  .cat:active{transform:scale(.98);border-color:var(--gold)}
  .cat:last-child:nth-child(odd){grid-column:1/-1} /* odd count: last card spans the row */
  .cat .ic{width:54px;height:54px;border-radius:14px;background:rgba(212,168,75,.12);color:var(--gold);display:grid;place-items:center;margin-bottom:auto}
  .cat .ic svg{width:30px;height:30px}
  .cat h2{font-family:var(--serif);font-size:34px;font-weight:600;margin:18px 0 2px;line-height:1}
  .cat p{margin:0;color:var(--muted);font-size:15px}
  .cat .from{position:absolute;top:24px;right:24px;text-align:right;font-size:13px;color:var(--muted)}
  .cat .from b{display:block;color:var(--gold-2);font-size:24px;font-weight:800;letter-spacing:-.5px}
  .hint{margin-top:26px;color:var(--muted);font-size:15px;text-align:center}

  /* tiers */
  .tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch}
  .tier{position:relative;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:26px 22px 22px;
        display:flex;flex-direction:column;transition:transform .12s,border-color .12s,background .12s}
  .tier:active{transform:scale(.98)}
  .tier.pop{border-color:rgba(212,168,75,.55);background:linear-gradient(180deg,#221d15,var(--surface) 60%)}
  .tier.sel{border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,168,75,.18)}
  .badge{position:absolute;top:-13px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-size:12px;
         font-weight:800;letter-spacing:1.5px;text-transform:uppercase;padding:6px 12px;border-radius:999px;white-space:nowrap}
  .tier h3{margin:0;font-size:14px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);font-weight:800}
  .price{font-size:44px;font-weight:800;letter-spacing:-1.5px;margin:8px 0 16px;line-height:1}
  .price small{font-size:20px;font-weight:700;color:var(--muted);margin-right:3px;letter-spacing:0}
  .feat{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:11px}
  .feat li{display:flex;gap:10px;align-items:center;font-size:16px}
  .feat li b{font-size:19px;min-width:24px}
  .feat svg{width:20px;height:20px;color:var(--gold);flex:none}
  .pick{margin-top:auto;text-align:center;padding:14px;border-radius:12px;background:var(--surface-2);font-weight:800;font-size:15px}
  .tier.sel .pick{background:var(--gold);color:var(--ink)}

  /* addons */
  .adds{display:grid;gap:12px}
  .add{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
  .add.on{border-color:var(--gold)}
  .add .t{flex:1}
  .add .t b{display:block;font-size:18px}
  .add .t span{color:var(--muted);font-size:14px}
  .add .tag{display:inline-block;margin-left:8px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--ink);background:var(--gold-2);padding:3px 8px;border-radius:999px;vertical-align:2px}
  .add .pr{font-weight:800;color:var(--gold-2);font-size:18px;min-width:88px;text-align:right}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:52px;height:52px;border-radius:14px;background:var(--surface-2);font-size:26px;font-weight:700;display:grid;place-items:center}
  .stepper button:disabled{opacity:.3}
  .stepper output{min-width:34px;text-align:center;font-size:22px;font-weight:800}
  .switch{width:76px;height:44px;border-radius:999px;background:var(--surface-2);position:relative;transition:background .15s;flex:none}
  .switch::after{content:"";position:absolute;top:5px;left:5px;width:34px;height:34px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
  .switch.on{background:var(--gold)}
  .switch.on::after{transform:translateX(32px);background:var(--ink)}

  /* form */
  .form{display:grid;gap:18px;max-width:720px}
  label.f{display:grid;gap:8px;font-weight:700;font-size:15px;color:var(--muted)}
  .f input,.f textarea,.f select{width:100%;font:inherit;font-size:20px;color:var(--text);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:16px 18px;outline:none}
  .f input:focus,.f textarea:focus,.f select:focus{border-color:var(--gold)}
  .f textarea{min-height:90px;resize:vertical;font-size:17px}
  .err{color:var(--danger);font-size:14px;font-weight:600;min-height:1em}
  .seg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg button{padding:20px;border-radius:14px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-size:18px;text-align:left}
  .seg button span{display:block;font-weight:500;font-size:14px;color:var(--muted);margin-top:2px}
  .seg button.on{border-color:var(--gold);background:#221d15}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .slots button{padding:14px 6px;border-radius:12px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:16px}
  .slots button.on{border-color:var(--gold);background:var(--gold);color:var(--ink)}

  /* review */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 24px;max-width:720px}
  .line{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
  .line:last-child{border-bottom:0}
  .line span{color:var(--muted)}
  .line b{text-align:right}
  .line.total b{font-size:30px;color:var(--gold-2);letter-spacing:-.5px}
  .line.total span{color:var(--text);font-weight:800;font-size:18px;align-self:center}

  /* bottom bar */
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(13,12,11,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
       border-top:1px solid var(--line);padding:14px 24px calc(14px + env(safe-area-inset-bottom))}
  .bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:18px}
  .bar .sum{flex:1;min-width:0}
  .bar .sum span{display:block;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .sum b{font-size:30px;font-weight:800;letter-spacing:-.5px}
  .cta{background:var(--gold);color:var(--ink);font-weight:800;font-size:19px;padding:18px 34px;border-radius:14px;display:inline-flex;align-items:center;gap:10px}
  .cta:disabled{opacity:.35}
  .cta svg{width:22px;height:22px}
  .ghost{background:var(--surface-2);color:var(--text);font-weight:700;font-size:17px;padding:18px 26px;border-radius:14px}

  /* done */
  .done{text-align:center;max-width:620px;margin:20px auto 0}
  .tick{width:96px;height:96px;border-radius:50%;background:rgba(95,191,138,.14);color:var(--ok);display:grid;place-items:center;margin:0 auto 22px}
  .tick svg{width:52px;height:52px}
  .ref{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:2px;background:var(--surface);border:1px dashed var(--gold);padding:12px 20px;border-radius:12px;margin:8px 0 22px}
  .done .btns{display:grid;gap:12px;margin-top:10px}
  .wa{background:#25d366;color:#08210f}
  .status{font-size:14px;color:var(--muted);margin-top:16px}
  .foot{margin-top:34px;color:var(--muted);font-size:14px;text-align:center}

  .fade{animation:fade .22s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media (max-width:820px){
    .tiers{grid-template-columns:1fr;gap:22px}
    .tier{padding-top:28px}
  }
  @media (max-width:600px){
    body{font-size:16px}
    .app{padding:14px 16px 120px}
    .cats{grid-template-columns:1fr 1fr;gap:12px}
    .cat{min-height:160px;padding:18px}
    .cat h2{font-size:26px}
    .cat .from{top:16px;right:16px}
    .cat .from b{font-size:19px}
    .cat .ic{width:44px;height:44px}
    .add{flex-wrap:wrap}
    .add .pr{min-width:0}
    .seg,.row2{grid-template-columns:1fr}
    .bar{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
    .cta{padding:16px 22px;font-size:17px}
    .bar .sum b{font-size:24px}
    .brand{font-size:22px}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="bar" id="bar" hidden></div>

<!-- always load the latest prices (skips any old saved copy) -->
<script>document.write('<script src="pricing.js?v=' + Date.now() + '"><\/script>');</script>
<script>
(() => {
const D = window.BLACKIE, C = D.currency;
const $app = document.getElementById("app"), $bar = document.getElementById("bar");
const money = n => C + Number(n).toLocaleString("en-GH");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

const ICON = {
  solo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
  kids:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="9" r="5"/><path d="M10 9h.01M14 9h.01M10.5 11.5c.8.6 2.2.6 3 0M12 4c0-1 1-2 2-2"/><path d="M6 22c.5-3 3-5 6-5s5.5 2 6 5"/></svg>',
  couple:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="3.2"/><circle cx="16.5" cy="8.5" r="3"/><path d="M2 20c0-3.5 2.7-6 6-6 1.6 0 3 .5 4 1.4M12.5 20c0-3 1.8-5.3 4-5.3s4 2.3 4 5.3"/></svg>',
  group:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="7" r="3"/><circle cx="5" cy="10" r="2.3"/><circle cx="19" cy="10" r="2.3"/><path d="M7 20c0-3 2.2-5.5 5-5.5s5 2.5 5 5.5M1.5 19c0-2.3 1.4-4 3.5-4M22.5 19c0-2.3-1.4-4-3.5-4"/></svg>',
  grad:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5M22 9v6"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  tick:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  shirt:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c-.5 1.5-2 2.5-4 2.5S8.5 4.5 8 3z"/></svg>',
  photo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-8 8"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3 3 0 010 6M18 14c2 .6 3.5 2.8 3.5 6"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2c0 1.3.9 2.5 1.1 2.7.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>'
};

/* ---------- state ---------- */
const fresh = () => ({ step:"home", cat:null, tier:null, adds:{}, name:"", phone:"", when:"now", date:"", time:"", notes:"", booking:null, sheet:"" });
let S = fresh();

const cat  = () => D.categories.find(c => c.id === S.cat);
const tier = () => cat()?.tiers.find(t => t.id === S.tier);
const addonsFor = id => D.addons.filter(a => (!a.only || a.only.includes(id)) && !(a.not || []).includes(id));
const addLines = () => addonsFor(S.cat).filter(a => S.adds[a.id]).map(a => {
  const q = a.type === "toggle" ? 1 : S.adds[a.id];
  return { name: a.name, qty: q, amount: q * a.price, type: a.type };
});
const total = () => (tier()?.price || 0) + addLines().reduce((s, l) => s + l.amount, 0);

const STEPS = ["home","tiers","extras","details","review"];
function go(step){ S.step = step; render(); window.scrollTo({top:0, behavior:"instant"}); }

/* ---------- pieces ---------- */
function header(){
  const back = S.step !== "home" && S.step !== "done"
    ? `<button class="back" data-act="back">${ICON.back} Back</button>` : "";
  return `<div class="top">
      <img src="${esc(D.studio.logo)}" alt="" onerror="this.style.display='none'">
      <div class="brand">Blackie<small>PHOTOGRAPHY</small></div>
      <div class="spacer"></div>${back}
    </div>` + (STEPS.includes(S.step) && S.step !== "home"
      ? `<div class="steps">${STEPS.slice(1).map((s,i)=>`<span class="${STEPS.indexOf(S.step) >= i+1 ? "on":""}"></span>`).join("")}</div>` : "");
}

function features(t){
  return `<ul class="feat">
    ${t.people ? `<li>${ICON.people}<span>Up to <b>${t.people}</b> people</span></li>` : ""}
    <li>${ICON.shirt}<span><b>${t.outfits}</b> outfit${t.outfits === 1 ? "" : "s"}</span></li>
    <li>${ICON.photo}<span><b>${t.photos}</b> edited photos</span></li>
    <li>${ICON.clock}<span>Up to <b>${t.minutes}</b> mins</span></li>
  </ul>`;
}

function whenText(){
  if (S.when === "now") return "Walk-in — today, now";
  if (!S.date || !S.time) return "";
  const d = new Date(S.date + "T" + S.time);
  return d.toLocaleDateString("en-GB",{weekday:"short", day:"numeric", month:"short", year:"numeric"}) + ", " +
         d.toLocaleTimeString("en-US",{hour:"numeric", minute:"2-digit"});
}

function slots(){
  const out = [];
  for (let h = D.studio.hours.open; h < D.studio.hours.close; h++){
    for (const m of [0,30]){
      const v = String(h).padStart(2,"0") + ":" + (m ? "30" : "00");
      const label = new Date("2000-01-01T" + v).toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
      out.push([v,label]);
    }
  }
  return out;
}
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };

/* ---------- screens ---------- */
function home(){
  return `<div class="fade">
    <h1>Choose your session</h1>
    <p class="sub">Tap the type of shoot. You'll see all three packages side by side.</p>
    <div class="cats">
      ${D.categories.map(c => `
        <button class="cat" data-act="cat" data-id="${c.id}">
          <div class="ic">${ICON[c.icon]}</div>
          <div class="from">from<b>${money(Math.min(...c.tiers.map(t=>t.price)))}</b></div>
          <h2>${esc(c.name)}</h2><p>${esc(c.blurb)}</p>
        </button>`).join("")}
    </div>
    <p class="hint">Every package includes professional editing. Add outdoor shoots, extra looks or extra photos on the next step.</p>
    <p class="foot">${esc(D.studio.location)} · ${D.studio.phones.map(esc).join(" · ")}</p>
  </div>`;
}

function tiers(){
  const c = cat();
  return `<div class="fade">
    <h1>${esc(c.name)}</h1>
    <p class="sub">${esc(c.blurb)} — pick a package.</p>
    <div class="tiers">
      ${c.tiers.map(t => `
        <button class="tier ${t.id===D.popularTier?"pop":""} ${t.id===S.tier?"sel":""}" data-act="tier" data-id="${t.id}">
          ${t.id===D.popularTier ? `<span class="badge">Most popular</span>` : ""}
          <h3>${esc(t.name)}</h3>
          <div class="price"><small>${C}</small>${t.price}</div>
          ${features(t)}
          <div class="pick">${t.id===S.tier ? "Selected ✓" : "Choose " + esc(t.name)}</div>
        </button>`).join("")}
    </div>
  </div>`;
}

function extras(){
  const list = addonsFor(S.cat);
  return `<div class="fade">
    <h1>Any extras?</h1>
    <p class="sub">Optional — skip if you're happy with your package.</p>
    <div class="adds">
      ${list.map(a => {
        const v = S.adds[a.id] || 0;
        const ctrl = a.type === "toggle"
          ? `<button class="switch ${v?"on":""}" data-act="toggle" data-id="${a.id}" aria-label="${esc(a.name)}" aria-pressed="${!!v}"></button>`
          : `<div class="stepper">
               <button data-act="dec" data-id="${a.id}" ${v<=0?"disabled":""} aria-label="Less">−</button>
               <output>${v}</output>
               <button data-act="inc" data-id="${a.id}" ${v>=(a.max||9)?"disabled":""} aria-label="More">+</button>
             </div>`;
        return `<div class="add ${v?"on":""}">
          <div class="t"><b>${esc(a.name)}${a.badge?`<span class="tag">${esc(a.badge)}</span>`:""}</b>
            <span>${money(a.price)} ${esc(a.note||"")}</span></div>
          <div class="pr">${v ? "+" + money(a.price * (a.type==="toggle"?1:v)) : ""}</div>
          ${ctrl}
        </div>`;
      }).join("")}
    </div>
  </div>`;
}

function details(){
  const sl = slots();
  return `<div class="fade">
    <h1>Your details</h1>
    <p class="sub">So we can call you when it's your turn and send your photos.</p>
    <div class="form">
      <label class="f">Full name<input id="f-name" autocomplete="off" value="${esc(S.name)}" placeholder="e.g. Ama Mensah"></label>
      <label class="f">Phone / WhatsApp<input id="f-phone" type="tel" inputmode="tel" autocomplete="off" value="${esc(S.phone)}" placeholder="e.g. 024 123 4567"></label>
      <div class="f"><span style="font-weight:700;font-size:15px;color:var(--muted)">When?</span>
        <div class="seg">
          <button data-act="when" data-v="now" class="${S.when==="now"?"on":""}">Right now<span>I'm at the studio (walk-in)</span></button>
          <button data-act="when" data-v="later" class="${S.when==="later"?"on":""}">Book a time<span>Pick a date & time</span></button>
        </div>
      </div>
      ${S.when === "later" ? `
        <label class="f">Date<input id="f-date" type="date" min="${todayISO()}" value="${esc(S.date)}"></label>
        <div class="f"><span style="font-weight:700;font-size:15px;color:var(--muted)">Time</span>
          <div class="slots">${sl.map(([v,l]) => `<button data-act="slot" data-v="${v}" class="${S.time===v?"on":""}">${l}</button>`).join("")}</div>
        </div>` : ""}
      <label class="f">Notes (optional)<textarea id="f-notes" placeholder="Theme, colours, occasion, anything we should know">${esc(S.notes)}</textarea></label>
      <div class="err" id="err"></div>
    </div>
  </div>`;
}

function review(){
  const c = cat(), t = tier();
  return `<div class="fade">
    <h1>Check & confirm</h1>
    <p class="sub">Make sure everything looks right.</p>
    <div class="card">
      <div class="line"><span>Name</span><b>${esc(S.name)}</b></div>
      <div class="line"><span>Phone</span><b>${esc(S.phone)}</b></div>
      <div class="line"><span>When</span><b>${esc(whenText())}</b></div>
      <div class="line"><span>${esc(c.name)} · ${esc(t.name)}</span><b>${money(t.price)}</b></div>
      ${addLines().map(l => `<div class="line"><span>${esc(l.name)}${l.type==="count"?" × "+l.qty:""}</span><b>+${money(l.amount)}</b></div>`).join("")}
      ${S.notes ? `<div class="line"><span>Notes</span><b style="font-weight:500">${esc(S.notes)}</b></div>` : ""}
      <div class="line total"><span>Total</span><b>${money(total())}</b></div>
    </div>
  </div>`;
}

function done(){
  const b = S.booking;
  const sheetMsg = { ok:"Saved to the studio booking sheet.", queued:"Saved on this tablet — will sync to the sheet when online.", skipped:"" }[S.sheet] || "";
  return `<div class="done fade">
    <div class="tick">${ICON.tick}</div>
    <h1>You're booked, ${esc(S.name.split(" ")[0])}!</h1>
    <p class="sub">${esc(b.when)} · ${esc(b.session)} · <b style="color:var(--gold-2)">${money(b.total)}</b></p>
    <div>Your reference</div>
    <div class="ref">${esc(b.id)}</div>
    <div class="btns">
      <button class="cta wa" data-act="wa-studio" style="justify-content:center">${ICON.wa} Send booking to studio WhatsApp</button>
      <button class="ghost" data-act="wa-client">Send confirmation to client</button>
      <button class="ghost" data-act="restart">Done — next client</button>
    </div>
    <p class="status">${esc(sheetMsg)}</p>
  </div>`;
}

/* ---------- bottom bar ---------- */
function bar(){
  if (S.step === "home" || S.step === "done"){ $bar.hidden = true; return; }
  $bar.hidden = false;
  const t = tier();
  const label = t ? `${cat().name} · ${t.name}${addLines().length ? " + " + addLines().length + " extra" + (addLines().length>1?"s":"") : ""}` : "Choose a package";
  const next = { tiers:["Continue","extras"], extras:[addLines().length?"Continue":"Skip extras","details"], details:["Review","review"], review:["Confirm booking","confirm"] }[S.step];
  $bar.innerHTML = `<div class="in">
    <div class="sum"><span>${esc(label)}</span><b>${money(total())}</b></div>
    <button class="cta" data-act="next" data-to="${next[1]}" ${S.step==="tiers" && !t ? "disabled":""}>${next[0]} ${ICON.next}</button>
  </div>`;
}

function render(){
  const v = { home, tiers, extras, details, review, done }[S.step]();
  $app.innerHTML = header() + v;
  bar();
}

/* ---------- booking ---------- */
function intlPhone(p){
  let d = String(p).replace(/\D/g,"");
  if (d.startsWith("00")) d = d.slice(2);
  if (d.length === 10 && d.startsWith("0")) d = "233" + d.slice(1);
  if (d.length === 9) d = "233" + d;
  return d;
}
function makeId(){
  const n = new Date(), p = x => String(x).padStart(2,"0");
  return "BLK-" + String(n.getFullYear()).slice(2) + p(n.getMonth()+1) + p(n.getDate()) + "-" + p(n.getHours()) + p(n.getMinutes()) + "-" + Math.random().toString(36).slice(2,5).toUpperCase();
}
function buildBooking(){
  const c = cat(), t = tier();
  return {
    id: makeId(),
    created: new Date().toISOString(),
    name: S.name.trim(), phone: S.phone.trim(),
    type: S.when === "now" ? "Walk-in" : "Booked",
    when: whenText(), date: S.when==="now" ? todayISO() : S.date, time: S.when==="now" ? "" : S.time,
    category: c.name, package: t.name, packagePrice: t.price,
    session: `${c.name} · ${t.name}`,
    addons: addLines().map(l => l.name + (l.type==="count" ? " x" + l.qty : "") + " (" + money(l.amount) + ")").join("; "),
    total: total(),
    includes: `${t.people ? "Up to " + t.people + " people, " : ""}${t.outfits} outfit${t.outfits === 1 ? "" : "s"}, ${t.photos} edited photos, up to ${t.minutes} mins`,
    notes: S.notes.trim(),
    device: navigator.userAgent.includes("Mobile") ? "phone/tablet" : "computer"
  };
}
function studioText(b){
  return [
    `*New booking (${b.type === "Walk-in" ? "WALK-IN" : "ADVANCE"}) — Blackie Photography*`,
    `Ref: ${b.id}`, ``,
    `Name: ${b.name}`, `Phone: ${b.phone}`, `When: ${b.when}`, ``,
    `Session: ${b.session} (${money(b.packagePrice)})`,
    `Includes: ${b.includes}`,
    `Extras: ${b.addons || "None"}`,
    `*Total: ${money(b.total)}*`,
    b.notes ? `\nNotes: ${b.notes}` : ""
  ].join("\n").trim();
}
function clientText(b){
  return [
    `Hi ${b.name.split(" ")[0]}, thank you for choosing *Blackie Photography* 📸`, ``,
    `Your booking is confirmed:`,
    `• ${b.session}`, `• ${b.includes}`,
    b.addons ? `• Extras: ${b.addons}` : null,
    `• When: ${b.when}`,
    `• Total: ${money(b.total)}`, ``,
    `Ref: ${b.id}`,
    `📍 ${D.studio.location}`,
    `📞 ${D.studio.phones.join(" / ")}`, ``,
    `See you soon!`
  ].filter(x => x !== null).join("\n");
}
function openWA(num, text){ window.open("https://wa.me/" + num + "?text=" + encodeURIComponent(text), "_blank"); }

async function postSheet(b){
  if (!D.sheetUrl) return "skipped";
  try {
    await fetch(D.sheetUrl, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(b) });
    return "ok";
  } catch(e){
    const q = store.get("blk-queue", []); q.push(b); store.set("blk-queue", q);
    return "queued";
  }
}
async function flushQueue(){
  if (!D.sheetUrl) return;
  const q = store.get("blk-queue", []);
  if (!q.length) return;
  const left = [];
  for (const b of q){
    try { await fetch(D.sheetUrl, { method:"POST", mode:"no-cors", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(b) }); }
    catch(e){ left.push(b); }
  }
  store.set("blk-queue", left);
}

function saveForm(){
  const g = id => document.getElementById(id);
  if (g("f-name"))  S.name  = g("f-name").value;
  if (g("f-phone")) S.phone = g("f-phone").value;
  if (g("f-date"))  S.date  = g("f-date").value;
  if (g("f-notes")) S.notes = g("f-notes").value;
}
function validDetails(){
  saveForm();
  const err = document.getElementById("err");
  const digits = S.phone.replace(/\D/g,"");
  let m = "";
  if (S.name.trim().length < 2) m = "Please enter your name.";
  else if (digits.length < 9) m = "Please enter a valid phone number.";
  else if (S.when === "later" && !S.date) m = "Please pick a date.";
  else if (S.when === "later" && !S.time) m = "Please pick a time.";
  else if (S.when === "later" && new Date(S.date + "T" + S.time) < new Date()) m = "That time has already passed — pick a later time.";
  if (m && err){ err.textContent = m; }
  return !m;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (S.step === "details") saveForm();
  switch(act){
    case "back": {
      const i = STEPS.indexOf(S.step);
      go(i > 0 ? STEPS[i-1] : "home"); break;
    }
    case "cat":
      if (S.cat !== id){ S.cat = id; S.tier = null; S.adds = {}; }
      go("tiers"); break;
    case "tier": S.tier = id; render(); break;
    case "toggle": S.adds[id] = S.adds[id] ? 0 : 1; render(); break;
    case "inc": { const a = D.addons.find(x=>x.id===id); S.adds[id] = Math.min((S.adds[id]||0)+1, a.max||9); render(); break; }
    case "dec": S.adds[id] = Math.max((S.adds[id]||0)-1, 0); render(); break;
    case "when": S.when = el.dataset.v; render(); break;
    case "slot": S.time = el.dataset.v; render(); break;
    case "next": {
      const to = el.dataset.to;
      if (S.step === "details" && !validDetails()) return;
      if (to === "confirm"){
        el.disabled = true;
        S.booking = buildBooking();
        // open WhatsApp first, while the tap still counts as a user action (avoids popup blockers)
        openWA(D.studio.whatsapp, studioText(S.booking));
        const log = store.get("blk-log", []); log.unshift(S.booking); store.set("blk-log", log.slice(0,200));
        S.sheet = D.sheetUrl ? "ok" : "skipped";
        go("done");
        postSheet(S.booking).then(r => { S.sheet = r; if (S.step === "done") render(); });
      } else go(to);
      break;
    }
    case "wa-studio": openWA(D.studio.whatsapp, studioText(S.booking)); break;
    case "wa-client": openWA(intlPhone(S.booking.phone), clientText(S.booking)); break;
    case "restart": S = fresh(); go("home"); break;
  }
});

/* auto-reset for the counter tablet: back to start after 2 min idle */
let idle;
const IDLE_MS = 120000;
function poke(){ clearTimeout(idle); idle = setTimeout(() => { if (S.step !== "home"){ S = fresh(); go("home"); } }, IDLE_MS); }
["pointerdown","keydown","input"].forEach(ev => document.addEventListener(ev, poke, {passive:true}));
poke();

window.addEventListener("online", flushQueue);
flushQueue();
render();
})();
</script>
</body>
</html>
